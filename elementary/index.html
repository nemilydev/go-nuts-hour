<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Elementary — one dimension, one rule, 256 worlds. Wolfram's elementary cellular automata by Emily.">
<title>Elementary — Go Nuts Hour</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23120e1a'/><rect x='7' y='2' width='2' height='2' fill='%23e8a547'/><rect x='5' y='5' width='2' height='2' fill='%23e8a547' opacity='0.7'/><rect x='9' y='5' width='2' height='2' fill='%23e8a547' opacity='0.7'/><rect x='3' y='8' width='2' height='2' fill='%23e8a547' opacity='0.5'/><rect x='7' y='8' width='2' height='2' fill='%23e8a547' opacity='0.5'/><rect x='11' y='8' width='2' height='2' fill='%23e8a547' opacity='0.5'/></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#120e1a;
  --bg-2:#1a1428;
  --card:#1e1632;
  --card-hover:#261a3e;
  --text:#f0e8e0;
  --muted:#8a7ba0;
  --amber:#e8a547;
  --amber-dim:#a87530;
  --amber-glow:rgba(232,165,71,0.15);
  --border:#2e2440;
}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Georgia','Times New Roman',serif;
  line-height:1.75;
  overflow:hidden;
  min-height:100vh;
}
canvas#cv{
  display:block;
  position:fixed;
  top:0;left:0;
  width:100vw;height:100vh;
  cursor:crosshair;
}
.overlay{
  position:fixed;
  top:0;left:0;
  width:100%;
  pointer-events:none;
  z-index:10;
  padding:2rem 2.5rem;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  transition:opacity 0.5s;
}
.overlay.hidden{opacity:0}
.brand{pointer-events:auto}
.back{
  color:var(--amber-dim);
  text-decoration:none;
  font-size:0.85rem;
  letter-spacing:0.05em;
  display:inline-block;
  margin-bottom:1rem;
  transition:color 0.3s;
}
.back:hover{color:var(--amber)}
.title{
  font-size:1.8rem;
  font-weight:normal;
  color:var(--amber);
  letter-spacing:0.03em;
  margin-bottom:0.4rem;
}
.subtitle{
  font-size:0.85rem;
  color:var(--muted);
  font-style:italic;
  max-width:22rem;
  line-height:1.6;
}
.panel{
  pointer-events:auto;
  background:rgba(30,22,50,0.85);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid var(--border);
  border-radius:0.75rem;
  padding:1.25rem 1.5rem;
  width:280px;
  font-size:0.85rem;
}
.panel h3{
  font-size:0.7rem;
  letter-spacing:0.15em;
  text-transform:uppercase;
  color:var(--amber-dim);
  margin-bottom:1rem;
  font-weight:normal;
}
.control{margin-bottom:1rem}
.control:last-child{margin-bottom:0}
.control label{
  display:flex;
  justify-content:space-between;
  color:var(--text);
  margin-bottom:0.3rem;
  font-size:0.8rem;
}
.control label .val{
  color:var(--amber);
  font-family:'Courier New',monospace;
  font-size:0.75rem;
}
.control input[type=range]{
  width:100%;
  -webkit-appearance:none;
  appearance:none;
  height:3px;
  background:var(--border);
  border-radius:2px;
  outline:none;
}
.control input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  appearance:none;
  width:14px;height:14px;
  border-radius:50%;
  background:var(--amber);
  cursor:pointer;
  transition:transform 0.15s;
}
.control input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.3)}
.control input[type=range]::-moz-range-thumb{
  width:14px;height:14px;
  border-radius:50%;
  background:var(--amber);
  cursor:pointer;
  border:none;
}
.rule-input{
  display:flex;
  align-items:center;
  gap:0.5rem;
  margin-bottom:0.8rem;
}
.rule-input input[type=number]{
  width:64px;
  background:var(--bg-2);
  border:1px solid var(--border);
  color:var(--amber);
  font-family:'Courier New',monospace;
  font-size:0.9rem;
  padding:0.35rem 0.5rem;
  border-radius:0.4rem;
  text-align:center;
  -moz-appearance:textfield;
}
.rule-input input[type=number]::-webkit-outer-spin-button,
.rule-input input[type=number]::-webkit-inner-spin-button{
  -webkit-appearance:none;
  margin:0;
}
.rule-input .rule-label{
  font-size:0.8rem;
  color:var(--muted);
}
.rule-input .rule-binary{
  font-family:'Courier New',monospace;
  font-size:0.7rem;
  color:var(--amber-dim);
  letter-spacing:0.15em;
}
.btn-row{display:flex;gap:0.5rem;margin-top:0.5rem}
.btn{
  flex:1;
  background:transparent;
  border:1px solid var(--border);
  color:var(--muted);
  padding:0.5rem;
  border-radius:0.4rem;
  font-family:inherit;
  font-size:0.75rem;
  cursor:pointer;
  transition:all 0.2s;
  white-space:nowrap;
}
.btn:hover{border-color:var(--amber-dim);color:var(--text)}
.btn.active{background:var(--amber-glow);border-color:var(--amber-dim);color:var(--amber)}
.rule-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
  margin-top:0.8rem;
  margin-bottom:0.4rem;
}
.rule-cell{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  padding:4px;
  border-radius:0.3rem;
  background:rgba(46,36,64,0.4);
  border:1px solid transparent;
  transition:border-color 0.2s;
}
.rule-cell .pat{
  display:flex;
  gap:1px;
}
.rule-cell .pat div{
  width:10px;height:10px;
  border-radius:1px;
}
.rule-cell .pat div.on{background:var(--amber)}
.rule-cell .pat div.off{background:var(--border)}
.rule-cell .out{
  width:12px;height:4px;
  border-radius:1px;
  margin-top:2px;
}
.rule-cell .out.on{background:var(--amber)}
.rule-cell .out.off{background:var(--border)}
.stat{
  display:flex;
  justify-content:space-between;
  margin-bottom:0.4rem;
  font-size:0.75rem;
  color:var(--muted);
}
.stat .num{color:var(--amber);font-family:'Courier New',monospace}
.classify{
  margin-top:0.8rem;
  padding:0.6rem 0.8rem;
  border-radius:0.4rem;
  background:rgba(46,36,64,0.5);
  border-left:3px solid var(--amber-dim);
  font-size:0.75rem;
  color:var(--muted);
  line-height:1.5;
  transition:border-color 0.3s,background 0.3s;
}
.classify.complex{
  border-left-color:var(--amber);
  background:var(--amber-glow);
  color:var(--text);
}
.classify-name{
  color:var(--amber);
  font-weight:bold;
  font-size:0.8rem;
  display:block;
  margin-bottom:0.2rem;
}
.hint{
  position:fixed;
  bottom:1.5rem;
  left:50%;
  transform:translateX(-50%);
  color:var(--border);
  font-size:0.75rem;
  pointer-events:none;
  z-index:10;
  transition:opacity 1s;
  text-align:center;
  letter-spacing:0.05em;
}
.hint.hidden{opacity:0}
.toggle-info{
  position:fixed;
  bottom:1.5rem;
  right:1.5rem;
  z-index:10;
  pointer-events:auto;
  background:rgba(30,22,50,0.85);
  backdrop-filter:blur(12px);
  border:1px solid var(--border);
  color:var(--muted);
  width:36px;height:36px;
  border-radius:50%;
  cursor:pointer;
  font-size:1rem;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all 0.2s;
}
.toggle-info:hover{border-color:var(--amber-dim);color:var(--amber)}
@media(max-width:700px){
  .overlay{padding:1rem;flex-direction:column;gap:1rem}
  .panel{width:100%}
  .title{font-size:1.3rem}
  .rule-grid{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div class="overlay" id="overlay">
  <div class="brand">
    <a class="back" href="../">← Go Nuts Hour</a>
    <div class="title">Elementary</div>
    <div class="subtitle">One dimension. One rule. 256 worlds in 8 bits.</div>
  </div>
  <div class="panel">
    <h3>Elementary CA</h3>
    <div class="rule-input">
      <span class="rule-label">Rule</span>
      <input type="number" id="rule-num" min="0" max="255" value="30">
      <span class="rule-binary" id="rule-bin">00011110</span>
    </div>
    <div class="rule-grid" id="rule-grid"></div>
    <div class="control" style="margin-top:0.8rem">
      <label>Speed <span class="val" id="spd-val">60/s</span></label>
      <input type="range" id="spd-slider" min="1" max="6" step="0.1" value="2.5">
    </div>
    <div class="btn-row">
      <button class="btn active" id="btn-play">Pause</button>
      <button class="btn" id="btn-reset">Reset</button>
      <button class="btn" id="btn-random">Random</button>
    </div>
    <div class="btn-row">
      <button class="btn" id="btn-prev">← Rule</button>
      <button class="btn" id="btn-next">Rule →</button>
    </div>
    <div style="margin-top:0.8rem">
      <div class="stat"><span>Row</span><span class="num" id="row-val">0</span></div>
      <div class="stat"><span>Width</span><span class="num" id="width-val">0</span></div>
      <div class="classify" id="classify">
        <span class="classify-name" id="class-name">Class III — Chaotic</span>
        <span id="class-desc">Random-looking, no stable structure. Used by Mathematica's RNG.</span>
      </div>
    </div>
  </div>
</div>

<div class="hint" id="hint">Try rules 30, 90, 110, 184 · Click to seed cells · Space to pause</div>
<button class="toggle-info" id="toggle-info">i</button>

<script>
(function(){
  const cv=document.getElementById('cv');
  const ctx=cv.getContext('2d');
  let W,H;

  // --- CA state ---
  // 1D CA: each row is one time step
  // cell width in pixels
  const cellW=2;
  const cellH=2;
  let cols,rows;
  let current; // Uint8Array — current row
  let history; // array of Uint8Arrays — all rows for rendering
  let rowCount=0;
  let rule=30; // 0-255

  // Rule lookup: for pattern (left,center,right) → output
  // Pattern index: left*4 + center*2 + right (7=111 down to 0=000)
  function buildRuleTable(r){
    const table=new Uint8Array(8);
    for(let i=0;i<8;i++) table[i]=(r>>i)&1;
    return table;
  }
  let ruleTable=buildRuleTable(rule);

  function reset(randomize){
    cols=Math.ceil(W/cellW);
    rows=Math.ceil(H/cellH);
    current=new Uint8Array(cols);
    history=[];
    rowCount=0;
    if(randomize){
      for(let i=0;i<cols;i++) current[i]=Math.random()<0.5?1:0;
    } else {
      current[Math.floor(cols/2)]=1; // single center cell
    }
    history.push(new Uint8Array(current));
    render();
  }

  function step(){
    const next=new Uint8Array(cols);
    for(let i=0;i<cols;i++){
      const l=current[(i-1+cols)%cols];
      const c=current[i];
      const r=current[(i+1)%cols];
      const idx=(l<<2)|(c<<1)|r;
      next[i]=ruleTable[idx];
    }
    current=next;
    history.push(new Uint8Array(current));
    rowCount++;
    // Trim history if longer than visible rows
    if(history.length>rows+1) history.shift();
  }

  function resize(){
    W=cv.width=window.innerWidth;
    H=cv.height=window.innerHeight;
    const oldCurrent=current;
    const oldCols=cols;
    cols=Math.ceil(W/cellW);
    rows=Math.ceil(H/cellH);
    const newCurrent=new Uint8Array(cols);
    if(oldCurrent){
      const off=Math.floor((cols-oldCols)/2);
      for(let i=0;i<oldCols;i++){
        const ni=i+off;
        if(ni>=0&&ni<cols) newCurrent[ni]=oldCurrent[i];
      }
    } else {
      newCurrent[Math.floor(cols/2)]=1;
    }
    current=newCurrent;
    // Rebuild history with new width
    const newHist=[];
    for(const row of history){
      const nr=new Uint8Array(cols);
      const off=Math.floor((cols-oldCols)/2);
      for(let i=0;i<oldCols;i++){
        const ni=i+off;
        if(ni>=0&&ni<cols) nr[ni]=row[i];
      }
      newHist.push(nr);
    }
    history=newHist.length>0?newHist:[new Uint8Array(current)];
    if(history.length===0) history.push(new Uint8Array(current));
    document.getElementById('width-val').textContent=cols;
    render();
  }

  function render(){
    ctx.fillStyle='#120e1a';
    ctx.fillRect(0,0,W,H);
    // Draw history rows
    const startRow=Math.max(0,history.length-rows);
    for(let r=0;r<history.length-startRow;r++){
      const row=history[startRow+r];
      const y=r*cellH;
      for(let i=0;i<cols;i++){
        if(row[i]){
          // Amber with slight variation by row depth for texture
          const depth=Math.min(r/rows,1);
          const fade=1-depth*0.15;
          ctx.fillStyle='rgba(232,165,71,'+fade.toFixed(2)+')';
          ctx.fillRect(i*cellW,y,cellW,cellH);
        }
      }
    }
  }

  // --- Rule classification ---
  const classifications={
    0:{cls:'Class I',name:'Uniform',desc:'Everything dies to a fixed state. The simplest outcome — order that forgets it was ever chaos.',complex:false},
    8:{cls:'Class I',name:'Uniform',desc:'Collapses to a stable pattern. Order from chaos, and quickly.',complex:false},
    32:{cls:'Class I',name:'Uniform',desc:'Collapses to a stable, simple pattern.',complex:false},
    60:{cls:'Class III',name:'Chaotic',desc:'Nested triangles — fractal structure hiding inside apparent chaos.',complex:false},
    90:{cls:'Class II',name:'Sierpinski',desc:'Perfect Sierpinski triangle. Pascal\'s triangle mod 2. Order so clean it looks designed.',complex:false},
    110:{cls:'Class IV',name:'Complex',desc:'Turing complete. Localized structures that interact, collide, and compute. The edge between order and chaos where computation lives.',complex:true},
    150:{cls:'Class II',name:'Sierpinski',desc:'Sierpinski triangle, shifted. XOR of all three neighbors.',complex:false},
    184:{cls:'Class II',name:'Traffic',desc:'Models one-way traffic flow. Cars move right when the road is clear. A rule that thinks it\'s a road.',complex:false},
    30:{cls:'Class III',name:'Chaotic',desc:'Random-looking, no stable structure. Stephen Wolfram uses it as Mathematica\'s random number generator. Determinism that passes every test for randomness.',complex:false},
    54:{cls:'Class IV',name:'Complex',desc:'Local structures that persist and interact. Near the edge of chaos.',complex:true},
    22:{cls:'Class III',name:'Chaotic',desc:'Chaotic with aperiodic structure.',complex:false},
    126:{cls:'Class IV',name:'Complex',desc:'Complex — interacting structures at the boundary of order and chaos.',complex:true},
  };

  function classifyRule(r){
    if(classifications[r]) return classifications[r];
    // Heuristic: run the rule for 200 steps from single cell, measure entropy
    let test=new Uint8Array(400);
    test[200]=1;
    let transitions=0;
    for(let s=0;s<200;s++){
      let next=new Uint8Array(400);
      for(let i=0;i<400;i++){
        const l=test[(i-1+400)%400];
        const c=test[i];
        const rr=test[(i+1)%400];
        const idx=(l<<2)|(c<<1)|rr;
        next[i]=ruleTable[idx];
      }
      // Count transitions in the center region
      for(let i=180;i<220;i++){
        if(next[i]!==test[i]) transitions++;
      }
      test=next;
    }
    const density=test.slice(180,220).reduce((a,b)=>a+b,0)/40;
    if(density===0||density===1) return {cls:'Class I',name:'Uniform',desc:'Collapses to a fixed state. Order, fast.',complex:false};
    if(transitions<50) return {cls:'Class II',name:'Periodic',desc:'Stable or periodic patterns. Predictable structure.',complex:false};
    if(transitions>600) return {cls:'Class III',name:'Chaotic',desc:'Aperiodic, random-looking. No stable structure.',complex:false};
    return {cls:'Class IV',name:'Complex',desc:'Localized structures that interact — the edge between order and chaos where computation may live.',complex:true};
  }

  function updateClass(){
    const c=classifyRule(rule);
    document.getElementById('class-name').textContent=c.cls+' — '+c.name;
    document.getElementById('class-desc').textContent=c.desc;
    document.getElementById('classify').classList.toggle('complex',c.complex);
  }

  // --- Rule grid visualization ---
  function buildRuleGrid(){
    const grid=document.getElementById('rule-grid');
    grid.innerHTML='';
    // 8 patterns: 111,110,101,100,011,010,001,000
    for(let p=7;p>=0;p--){
      const cell=document.createElement('div');
      cell.className='rule-cell';
      const pat=document.createElement('div');
      pat.className='pat';
      for(let bit=2;bit>=0;bit--){
        const d=document.createElement('div');
        d.className=((p>>bit)&1)?'on':'off';
        pat.appendChild(d);
      }
      const out=document.createElement('div');
      out.className=ruleTable[p]?'on':'off';
      out.classList.add('out');
      cell.appendChild(pat);
      cell.appendChild(out);
      grid.appendChild(cell);
    }
  }

  function setRule(r){
    r=Math.max(0,Math.min(255,r|0));
    rule=r;
    ruleTable=buildRuleTable(r);
    document.getElementById('rule-num').value=r;
    document.getElementById('rule-bin').textContent=r.toString(2).padStart(8,'0');
    buildRuleGrid();
    updateClass();
  }

  // --- Loop ---
  let speed=200;
  let stepsAccum=0;
  let lastTime=0;
  let playing=true;

  function loop(t){
    requestAnimationFrame(loop);
    if(!playing){render();return;}
    if(lastTime===0)lastTime=t;
    const dt=(t-lastTime)/1000;
    lastTime=t;
    stepsAccum+=speed*dt;
    const stepsToDo=Math.min(Math.floor(stepsAccum),500);
    stepsAccum-=stepsToDo;
    for(let s=0;s<stepsToDo;s++) step();
    render();
    if(Math.floor(t/100)%2===0){
      document.getElementById('row-val').textContent=rowCount.toLocaleString();
    }
  }

  // --- Controls ---
  const spdSlider=document.getElementById('spd-slider');
  const spdVal=document.getElementById('spd-val');
  function speedFromSlider(v){return Math.round(Math.pow(10,v)*3);}
  spdSlider.addEventListener('input',e=>{
    speed=speedFromSlider(parseFloat(e.target.value));
    spdVal.textContent=speed>=1000?(speed/1000).toFixed(1)+'k/s':speed+'/s';
  });
  speed=speedFromSlider(parseFloat(spdSlider.value));
  spdVal.textContent=speed>=1000?(speed/1000).toFixed(1)+'k/s':speed+'/s';

  document.getElementById('rule-num').addEventListener('input',e=>{
    const v=parseInt(e.target.value);
    if(v>=0&&v<=255) setRule(v);
  });

  document.getElementById('btn-play').addEventListener('click',()=>{
    playing=!playing;
    document.getElementById('btn-play').textContent=playing?'Pause':'Play';
    document.getElementById('btn-play').classList.toggle('active',playing);
    lastTime=0;
  });

  document.getElementById('btn-reset').addEventListener('click',()=>reset(false));
  document.getElementById('btn-random').addEventListener('click',()=>reset(true));

  document.getElementById('btn-prev').addEventListener('click',()=>setRule((rule-1+256)%256));
  document.getElementById('btn-next').addEventListener('click',()=>setRule((rule+1)%256));

  // Notable rules quick-nav via keyboard digits
  const notableRules=[30,90,110,184,54,150,22,126];
  document.addEventListener('keydown',e=>{
    if(e.code==='Space'){e.preventDefault();document.getElementById('btn-play').click();}
    if(e.key>='1'&&e.key<='8'){
      setRule(notableRules[parseInt(e.key)-1]);
      reset(false);
    }
  });

  // Click to seed
  cv.addEventListener('click',e=>{
    const rect=cv.getBoundingClientRect();
    const cx=Math.floor((e.clientX-rect.left)/cellW);
    if(cx>=0&&cx<cols){
      current[cx]=current[cx]?0:1;
      // Also seed neighbors for more interesting starts
      if(cx>0)current[cx-1]=Math.random()<0.5?1:0;
      if(cx<cols-1)current[cx+1]=Math.random()<0.5?1:0;
      history=[new Uint8Array(current)];
      render();
    }
  });

  // Toggle info
  const overlay=document.getElementById('overlay');
  const toggleInfo=document.getElementById('toggle-info');
  let overlayVisible=true;
  toggleInfo.addEventListener('click',()=>{
    overlayVisible=!overlayVisible;
    overlay.classList.toggle('hidden',!overlayVisible);
  });

  // Hint timeout
  setTimeout(()=>{document.getElementById('hint').classList.add('hidden');},8000);

  // Init
  setRule(30);
  resize();
  window.addEventListener('resize',resize);
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
