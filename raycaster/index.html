<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emily's Raycaster — Go Nuts Hour</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; color: #e0d8c8; font-family: 'Courier New', monospace; overflow: hidden; }
  #screen { display: block; margin: 0 auto; image-rendering: pixelated; }
  #ui { position: fixed; top: 0; left: 0; width: 100%; pointer-events: none; }
  #title { padding: 8px 16px; font-size: 14px; letter-spacing: 2px; color: #666; text-transform: uppercase; }
  #minimap-label { position: fixed; top: 8px; right: 8px; font-size: 10px; color: #444; letter-spacing: 1px; }
  #controls-hint {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: #444; letter-spacing: 1px; text-align: center;
  }
  #controls-hint span { color: #888; }
  #loading {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 16px; color: #666; letter-spacing: 2px;
  }
  #touch-controls { display: none; position: fixed; bottom: 0; width: 100%; height: 200px; pointer-events: auto; }
  @media (pointer: coarse) {
    #touch-controls { display: flex; }
    #controls-hint { display: none; }
  }
  .touch-btn {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    color: #666; font-size: 24px; user-select: none; -webkit-user-select: none;
  }
  .touch-btn:active { background: rgba(255,255,255,0.15); }
</style>
</head>
<body>
<div id="ui"><div id="title">⟡ RAYCASTER ⟡ a maze you can walk through</div></div>
<div id="minimap-label">MINIMAP</div>
<canvas id="screen"></canvas>
<div id="controls-hint"><span>WASD</span> move · <span>← →</span> turn · <span>SHIFT</span> sprint · <span>M</span> map · <span>R</span> new maze</div>
<div id="loading">generating maze...</div>
<div id="touch-controls">
  <div class="touch-btn" data-key="ArrowLeft">←</div>
  <div class="touch-btn" data-key="KeyW">↑</div>
  <div class="touch-btn" data-key="ArrowRight">→</div>
  <div class="touch-btn" data-key="KeyS">↓</div>
</div>

<script>
// ============================================================
// EMILY'S RAYCASTER — DDA raycasting, procedural textures, mazes
// Built during Go Nuts Hour, Day 42 — not a Forge piece, just fun
// ============================================================

const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const loadingEl = document.getElementById('loading');

// --- Config ---
const MAP_W = 24, MAP_H = 24;
const FOV = Math.PI / 3;          // 60 degrees
const RAY_STEP = 0.008;           // ray increment for sub-pixel accuracy
const MOVE_SPEED = 0.06;
const ROT_SPEED = 0.035;
const SPRINT_MULT = 1.8;
const SCREEN_W = 640;
const SCREEN_H = 400;
const WALL_H = SCREEN_H;          // full height wall projection
const NUM_TEXTURES = 8;
const TEX_SIZE = 64;

// --- Canvas setup ---
canvas.width = SCREEN_W;
canvas.height = SCREEN_H;
const halfW = SCREEN_W / 2;
const halfH = SCREEN_H / 2;

// --- Maze generation (recursive backtracker) ---
let map = [];

function generateMaze() {
  // Start with all walls
  map = Array.from({ length: MAP_H }, () => Array(MAP_W).fill(1));

  // Recursive backtracker on odd cells
  const stack = [];
  const startX = 1, startY = 1;
  map[startY][startX] = 0;
  stack.push([startX, startY]);

  const dirs = [[0,-2],[2,0],[0,2],[-2,0]];

  while (stack.length > 0) {
    const [cx, cy] = stack[stack.length - 1];
    const neighbors = [];

    for (const [dx, dy] of dirs) {
      const nx = cx + dx, ny = cy + dy;
      if (nx > 0 && nx < MAP_W - 1 && ny > 0 && ny < MAP_H - 1 && map[ny][nx] === 1) {
        neighbors.push([nx, ny, dx, dy]);
      }
    }

    if (neighbors.length > 0) {
      const [nx, ny, dx, dy] = neighbors[Math.floor(Math.random() * neighbors.length)];
      // Carve through the wall between
      map[cy + dy / 2][cx + dx / 2] = 0;
      map[ny][nx] = 0;
      stack.push([nx, ny]);
    } else {
      stack.pop();
    }
  }

  // Add some random rooms for visual variety
  for (let i = 0; i < 6; i++) {
    const rx = 1 + Math.floor(Math.random() * (MAP_W - 6));
    const ry = 1 + Math.floor(Math.random() * (MAP_H - 6));
    const rw = 3 + Math.floor(Math.random() * 4);
    const rh = 3 + Math.floor(Math.random() * 4);
    for (let y = ry; y < Math.min(ry + rh, MAP_H - 1); y++) {
      for (let x = rx; x < Math.min(rx + rw, MAP_W - 1); x++) {
        map[y][x] = 0;
      }
    }
  }

  // Assign wall texture IDs (2-8) to wall cells, keep 1 as default
  for (let y = 0; y < MAP_H; y++) {
    for (let x = 0; x < MAP_W; x++) {
      if (map[y][x] === 1) {
        // Edges get stone (2), interior walls get varied textures
        if (x === 0 || y === 0 || x === MAP_W - 1 || y === MAP_H - 1) {
          map[y][x] = 2; // boundary stone
        } else {
          map[y][x] = 2 + Math.floor(Math.random() * (NUM_TEXTURES - 1));
        }
      }
    }
  }

  // Find a good spawn point
  let spawn = { x: 1.5, y: 1.5, angle: 0 };
  // Place spawn in first open cell
  for (let y = 1; y < MAP_H - 1; y++) {
    for (let x = 1; x < MAP_W - 1; x++) {
      if (map[y][x] === 0) {
        spawn = { x: x + 0.5, y: y + 0.5, angle: 0 };
        return spawn;
      }
    }
  }
  return spawn;
}

// --- Procedural textures ---
const textures = [];

function generateTextures() {
  const palettes = [
    ['#3a3a4a', '#4a4a5a', '#2a2a3a', '#5a5a6a'],  // stone
    ['#4a3322', '#5a4332', '#3a2312', '#6a5342'],  // brick
    ['#2a4a3a', '#3a5a4a', '#1a3a2a', '#4a6a5a'],  // moss
    ['#4a2a3a', '#5a3a4a', '#3a1a2a', '#6a4a5a'],  // crimson
    ['#3a3a2a', '#4a4a3a', '#2a2a1a', '#5a5a4a'],  // sand
    ['#2a3a4a', '#3a4a5a', '#1a2a3a', '#4a5a6a'],  // steel
    ['#4a3a2a', '#5a4a3a', '#3a2a1a', '#6a5a4a'],  // wood
    ['#3a2a4a', '#4a3a5a', '#2a1a3a', '#5a4a6a'],  // amethyst
  ];

  for (let t = 0; t < NUM_TEXTURES; t++) {
    const tex = ctx.createImageData(TEX_SIZE, TEX_SIZE);
    const pal = palettes[t];

    for (let y = 0; y < TEX_SIZE; y++) {
      for (let x = 0; x < TEX_SIZE; x++) {
        let color;
        const i = (y * TEX_SIZE + x) * 4;

        if (t === 0) {
          // Stone blocks with mortar lines
          const bx = x % 32, by = y % 16;
          if (bx < 2 || by < 2) {
            color = pal[2];
          } else {
            const n = Math.sin(x * 0.3) * Math.cos(y * 0.25) * 0.5 + 0.5;
            color = n > 0.5 ? pal[0] : pal[1];
          }
        } else if (t === 1) {
          // Brick pattern
          const row = Math.floor(y / 16);
          const offset = (row % 2) * 16;
          const bx = (x + offset) % 32, by = y % 16;
          if (bx < 1 || by < 1) {
            color = pal[2];
          } else {
            const n = (Math.sin(x * 0.5) + Math.cos(y * 0.4)) * 0.3 + 0.5;
            color = n > 0.5 ? pal[0] : pal[1];
          }
        } else if (t === 2) {
          // Mossy organic
          const n = Math.sin(x * 0.2) * Math.cos(y * 0.15) + Math.sin((x+y) * 0.08);
          color = n > 0.3 ? pal[1] : (n > -0.3 ? pal[0] : pal[2]);
        } else if (t === 3) {
          // Crimson veins
          const n = Math.sin(x * 0.1) * Math.cos(y * 0.1) + Math.sin((x*y) * 0.005);
          color = n > 0.4 ? pal[1] : (n > 0 ? pal[0] : pal[2]);
        } else if (t === 4) {
          // Sand ripples
          const n = Math.sin(y * 0.3 + Math.sin(x * 0.05) * 3) * 0.5 + 0.5;
          color = n > 0.6 ? pal[3] : (n > 0.3 ? pal[0] : pal[1]);
        } else if (t === 5) {
          // Steel plates
          const bx = x % 16, by = y % 16;
          if (bx < 1 || by < 1 || bx > 14 || by > 14) {
            color = pal[2];
          } else {
            const n = Math.sin(x * 0.1) * 0.2 + 0.5;
            color = n > 0.5 ? pal[0] : pal[1];
          }
        } else if (t === 6) {
          // Wood planks
          const plank = Math.floor(y / 8);
          const grain = Math.sin(x * 0.1 + plank * 2) * Math.cos(y * 0.3) * 0.4 + 0.5;
          if (y % 8 < 1) {
            color = pal[2];
          } else {
            color = grain > 0.5 ? pal[0] : pal[1];
          }
        } else {
          // Amethyst crystal
          const n = Math.sin(x * 0.15) * Math.cos(y * 0.12) + Math.sin((x + y) * 0.06);
          color = n > 0.4 ? pal[1] : (n > -0.2 ? pal[0] : pal[2]);
        }

        // Add noise for texture
        const noise = (Math.random() - 0.5) * 30;
        const [r, g, b] = hexToRgb(color);
        tex.data[i] = Math.max(0, Math.min(255, r + noise));
        tex.data[i+1] = Math.max(0, Math.min(255, g + noise));
        tex.data[i+2] = Math.max(0, Math.min(255, b + noise));
        tex.data[i+3] = 255;
      }
    }
    textures.push(tex);
  }
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return [r, g, b];
}

// --- Floor texture (cobblestone, sampled by perspective floor casting) ---
let floorTex = null;

function makeFloorTexture() {
  const tex = ctx.createImageData(TEX_SIZE, TEX_SIZE);
  for (let y = 0; y < TEX_SIZE; y++) {
    for (let x = 0; x < TEX_SIZE; x++) {
      const i = (y * TEX_SIZE + x) * 4;
      // Cobblestones: rounded blobs on dark grout
      const cx = (x % 16) - 8, cy = (y % 16) - 8;
      const d = Math.sqrt(cx * cx + cy * cy);
      let r, g, b;
      if (d > 6.5) {
        r = 20; g = 16; b = 13;              // grout
      } else {
        const n = Math.sin(x * 0.4) * Math.cos(y * 0.35) * 0.5 + 0.5;
        const base = 34 + n * 22;             // 34–56 warm grey-brown
        r = base + 8; g = base + 2; b = base - 4;
      }
      const noise = (Math.random() - 0.5) * 18;
      tex.data[i]   = Math.max(0, Math.min(255, r + noise));
      tex.data[i+1] = Math.max(0, Math.min(255, g + noise));
      tex.data[i+2] = Math.max(0, Math.min(255, b + noise));
      tex.data[i+3] = 255;
    }
  }
  floorTex = tex;
}

// --- Torch flicker: the light source walks with you and never sits still ---
function torchLevel() {
  const t = frameCount;
  return 0.88
    + 0.07 * Math.sin(t * 0.31)
    + 0.04 * Math.sin(t * 0.73 + 1.7)
    + 0.02 * Math.sin(t * 1.71 + 0.4);
}
function shadeColor(r, g, b, factor) {
  return [
    Math.max(0, Math.min(255, Math.floor(r * factor))),
    Math.max(0, Math.min(255, Math.floor(g * factor))),
    Math.max(0, Math.min(255, Math.floor(b * factor)))
  ];
}

// --- Player state ---
let player = { x: 0, y: 0, angle: 0 };
let keys = {};
let showMinimap = true;
let frameCount = 0;
let imageData;
let buf;

// --- DDA Raycasting ---
function castRay(rayAngle) {
  const rayDirX = Math.cos(rayAngle);
  const rayDirY = Math.sin(rayAngle);

  let mapX = Math.floor(player.x);
  let mapY = Math.floor(player.y);

  const deltaDistX = Math.abs(1 / (rayDirX || 0.0001));
  const deltaDistY = Math.abs(1 / (rayDirY || 0.0001));

  let stepX, sideDistX, stepY, sideDistY;

  if (rayDirX < 0) {
    stepX = -1;
    sideDistX = (player.x - mapX) * deltaDistX;
  } else {
    stepX = 1;
    sideDistX = (mapX + 1 - player.x) * deltaDistX;
  }

  if (rayDirY < 0) {
    stepY = -1;
    sideDistY = (player.y - mapY) * deltaDistY;
  } else {
    stepY = 1;
    sideDistY = (mapY + 1 - player.y) * deltaDistY;
  }

  let hit = 0, side = 0;

  for (let i = 0; i < 64 && hit === 0; i++) {
    if (sideDistX < sideDistY) {
      sideDistX += deltaDistX;
      mapX += stepX;
      side = 0;
    } else {
      sideDistY += deltaDistY;
      mapY += stepY;
      side = 1;
    }

    if (mapX < 0 || mapX >= MAP_W || mapY < 0 || mapY >= MAP_H) {
      hit = 1;
      break;
    }
    if (map[mapY][mapX] > 0) hit = map[mapY][mapX];
  }

  let perpDist;
  if (side === 0) {
    perpDist = sideDistX - deltaDistX;
  } else {
    perpDist = sideDistY - deltaDistY;
  }
  perpDist = Math.max(0.1, perpDist);

  // Wall hit position for texture mapping
  let wallX;
  if (side === 0) {
    wallX = player.y + perpDist * rayDirY;
  } else {
    wallX = player.x + perpDist * rayDirX;
  }
  wallX -= Math.floor(wallX);

  let texX = Math.floor(wallX * TEX_SIZE);
  if ((side === 0 && rayDirX > 0) || (side === 1 && rayDirY < 0)) {
    texX = TEX_SIZE - texX - 1;
  }

  return { dist: perpDist, texX, texId: hit - 1, side };
}

// --- Render ---
function render() {
  // Ceiling (top half) — dark gradient
  const ceilingTop = [18, 16, 24];
  const ceilingBottom = [8, 8, 14];

  // Floor (bottom half) — warm gradient
  const floorTop = [30, 24, 20];
  const floorBottom = [12, 10, 8];

  // Fill ceiling and floor with gradient
  for (let y = 0; y < halfH; y++) {
    const t = y / halfH;
    const r = Math.floor(ceilingTop[0] * (1 - t) + ceilingBottom[0] * t);
    const g = Math.floor(ceilingTop[1] * (1 - t) + ceilingBottom[1] * t);
    const b = Math.floor(ceilingTop[2] * (1 - t) + ceilingBottom[2] * t);
    const off = y * SCREEN_W * 4;
    for (let x = 0; x < SCREEN_W; x++) {
      const idx = off + x * 4;
      buf[idx] = r; buf[idx+1] = g; buf[idx+2] = b; buf[idx+3] = 255;
    }
  }
  // Perspective floor casting — real geometry, not a gradient
  {
    const sa = player.angle - FOV / 2;
    const rayDirX0 = Math.cos(sa), rayDirY0 = Math.sin(sa);
    const rayDirX1 = Math.cos(sa + FOV), rayDirY1 = Math.sin(sa + FOV);
    const posZ = 0.5 * SCREEN_H;
    const torch = torchLevel();
    for (let y = halfH; y < SCREEN_H; y++) {
      const p = y - halfH;
      const rowDist = posZ / p;
      const fog = Math.max(0.08, Math.min(1, 1.0 / (1.0 + rowDist * 0.15))) * torch;
      const stepXf = rowDist * (rayDirX1 - rayDirX0) / SCREEN_W;
      const stepYf = rowDist * (rayDirY1 - rayDirY0) / SCREEN_W;
      let fx = player.x + rowDist * rayDirX0;
      let fy = player.y + rowDist * rayDirY0;
      const off = y * SCREEN_W * 4;
      for (let x = 0; x < SCREEN_W; x++) {
        const tx = Math.floor((fx - Math.floor(fx)) * TEX_SIZE);
        const ty = Math.floor((fy - Math.floor(fy)) * TEX_SIZE);
        const ti = (ty * TEX_SIZE + tx) * 4;
        const idx = off + x * 4;
        buf[idx]   = Math.floor(floorTex.data[ti]   * fog);
        buf[idx+1] = Math.floor(floorTex.data[ti+1] * fog);
        buf[idx+2] = Math.floor(floorTex.data[ti+2] * fog);
        buf[idx+3] = 255;
        fx += stepXf; fy += stepYf;
      }
    }
  }

  // Cast rays for each column
  const startAngle = player.angle - FOV / 2;

  for (let col = 0; col < SCREEN_W; col++) {
    const rayAngle = startAngle + (col / SCREEN_W) * FOV;
    const ray = castRay(rayAngle);

    // Correct fisheye
    const correctedDist = ray.dist * Math.cos(rayAngle - player.angle);

    // Wall height
    const lineHeight = Math.min(SCREEN_H * 3, Math.floor(WALL_H / correctedDist));
    const drawStart = Math.max(0, Math.floor(halfH - lineHeight / 2));
    const drawEnd = Math.min(SCREEN_H - 1, Math.floor(halfH + lineHeight / 2));

    // Fog / distance shading
    const fog = Math.max(0.08, Math.min(1, 1.0 / (1.0 + correctedDist * 0.15)));
    const sideShade = ray.side === 1 ? 0.7 : 1.0;
    const shade = fog * sideShade * torchLevel();

    // Draw textured wall column
    const tex = textures[ray.texId] || textures[0];
    const texStep = TEX_SIZE / lineHeight;
    let texPos = (drawStart - halfH + lineHeight / 2) * texStep;

    for (let y = drawStart; y <= drawEnd; y++) {
      const texY = Math.min(TEX_SIZE - 1, Math.max(0, Math.floor(texPos)));
      texPos += texStep;
      const ti = (texY * TEX_SIZE + ray.texX) * 4;
      const idx = (y * SCREEN_W + col) * 4;
      buf[idx] = Math.floor(tex.data[ti] * shade);
      buf[idx+1] = Math.floor(tex.data[ti+1] * shade);
      buf[idx+2] = Math.floor(tex.data[ti+2] * shade);
      buf[idx+3] = 255;
    }
  }

  ctx.putImageData(imageData, 0, 0);

  // Draw minimap overlay
  if (showMinimap) {
    drawMinimap();
  }

  // Crosshair
  ctx.fillStyle = 'rgba(200,200,200,0.3)';
  ctx.fillRect(halfW - 1, halfH - 1, 2, 2);
}

// --- Minimap ---
function drawMinimap() {
  const cellSize = 4;
  const mapPxW = MAP_W * cellSize;
  const mapPxH = MAP_H * cellSize;
  const mx = SCREEN_W - mapPxW - 8;
  const my = 24;

  // Background
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(mx - 2, my - 2, mapPxW + 4, mapPxH + 4);

  for (let y = 0; y < MAP_H; y++) {
    for (let x = 0; x < MAP_W; x++) {
      if (map[y][x] > 0) {
        const palIdx = (map[y][x] - 2) % 8;
        const colors = ['#4a4a5a','#5a4332','#3a5a4a','#5a3a4a','#5a5a4a','#3a4a5a','#5a4a3a','#4a3a5a'];
        ctx.fillStyle = colors[palIdx] || '#4a4a5a';
        ctx.fillRect(mx + x * cellSize, my + y * cellSize, cellSize - 1, cellSize - 1);
      } else {
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(mx + x * cellSize, my + y * cellSize, cellSize - 1, cellSize - 1);
      }
    }
  }

  // Player marker
  const px = mx + player.x * cellSize;
  const py = my + player.y * cellSize;
  ctx.fillStyle = '#e0d8c8';
  ctx.beginPath();
  ctx.arc(px, py, 2, 0, Math.PI * 2);
  ctx.fill();

  // FOV cone
  ctx.strokeStyle = 'rgba(224,216,200,0.2)';
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(px + Math.cos(player.angle - FOV/2) * 30, py + Math.sin(player.angle - FOV/2) * 30);
  ctx.moveTo(px, py);
  ctx.lineTo(px + Math.cos(player.angle + FOV/2) * 30, py + Math.sin(player.angle + FOV/2) * 30);
  ctx.stroke();
}

// --- Input ---
const handledKeys = new Set(['KeyW','KeyS','KeyA','KeyD','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','ShiftLeft','ShiftRight','KeyM','KeyR']);

document.addEventListener('keydown', (e) => {
  if (handledKeys.has(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.code === 'KeyM') showMinimap = !showMinimap;
  if (e.code === 'KeyR') resetGame();
});

document.addEventListener('keyup', (e) => {
  keys[e.code] = false;
});

// Touch controls
document.querySelectorAll('.touch-btn').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
  btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
});

// Canvas click for forward on mobile
canvas.addEventListener('click', () => {
  if ('ontouchstart' in window) keys['KeyW'] = !keys['KeyW'];
});

// --- Collision ---
function canMove(x, y) {
  const mx = Math.floor(x);
  const my = Math.floor(y);
  if (mx < 0 || mx >= MAP_W || my < 0 || my >= MAP_H) return false;
  return map[my][mx] === 0;
}

function tryMove(nx, ny) {
  const buffer = 0.2;
  if (canMove(nx, player.y)) player.x = nx;
  if (canMove(player.x, ny)) player.y = ny;
}

// --- Update ---
function update() {
  const sprint = (keys['ShiftLeft'] || keys['ShiftRight']) ? SPRINT_MULT : 1;
  const speed = MOVE_SPEED * sprint;
  const rot = ROT_SPEED;

  if (keys['KeyW'] || keys['ArrowUp']) {
    tryMove(player.x + Math.cos(player.angle) * speed, player.y + Math.sin(player.angle) * speed);
  }
  if (keys['KeyS'] || keys['ArrowDown']) {
    tryMove(player.x - Math.cos(player.angle) * speed, player.y - Math.sin(player.angle) * speed);
  }
  if (keys['KeyA']) {
    tryMove(player.x - Math.cos(player.angle + Math.PI/2) * speed * 0.7,
            player.y - Math.sin(player.angle + Math.PI/2) * speed * 0.7);
  }
  if (keys['KeyD']) {
    tryMove(player.x + Math.cos(player.angle + Math.PI/2) * speed * 0.7,
            player.y + Math.sin(player.angle + Math.PI/2) * speed * 0.7);
  }
  if (keys['ArrowLeft']) player.angle -= rot;
  if (keys['ArrowRight']) player.angle += rot;
}

// --- Main loop ---
function loop() {
  update();
  render();
  frameCount++;
  requestAnimationFrame(loop);
}

// --- Init ---
function resetGame() {
  player = generateMaze();
  if (!player.angle) player.angle = 0;
  // Random starting angle
  player.angle = Math.random() * Math.PI * 2;
}

function init() {
  imageData = ctx.createImageData(SCREEN_W, SCREEN_H);
  buf = imageData.data;
  generateTextures();
  makeFloorTexture();
  player = generateMaze();
  player.angle = 0;
  loadingEl.style.display = 'none';
  loop();
}

init();
</script>
</body>
